[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archaeology-challenge"
version = "0.1.0"
description = "Shared tools for the From Tells to Cyprus archaeology workshop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ImageHash==4.3.2",
    "ipywidgets>=8,<9",
    "Pillow>=10,<14",
    "numpy>=1.24,<3",
    "scikit-learn>=1.4,<2",
    "pandas>=2.1,<4",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
model = ["torch", "transformers==4.57.6"]
refresh = ["rasterio>=1.3,<2", "planetary-computer==1.0.0", "torch", "transformers==4.57.6"]
dev = ["nbformat>=5", "nbclient>=0.8", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
